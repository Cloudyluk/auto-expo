<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球汽车产业展会聚合平台 V6</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0b1120;--bg2:#111827;--card:rgba(255,255,255,0.04);--card-hover:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.08);--border-light:rgba(255,255,255,0.12);
  --text:#f1f5f9;--text-sec:#94a3b8;--text-dim:#64748b;
  --t1:#3b82f6;--t1g:#60a5fa;--t2:#14b8a6;--t2g:#2dd4bf;
  --t3:#f59e0b;--t3g:#fbbf24;--t4:#ec4899;--t4g:#f472b6;
  --cn:#ef4444;--cng:#f87171;
  --radius:14px;--radius-sm:8px;--radius-xs:6px;
}
html{font-size:15px;scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Noto Sans SC",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;
  background-image:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(59,130,246,0.08),transparent),
                   radial-gradient(ellipse 60% 40% at 80% 100%,rgba(20,184,166,0.06),transparent);
  transition:background .35s ease,color .35s ease}

/* Light */
html.light{
  --bg:#f0f4f8;--bg2:#e8edf3;--card:rgba(255,255,255,0.88);--card-hover:rgba(255,255,255,0.96);
  --border:rgba(0,0,0,0.08);--border-light:rgba(0,0,0,0.14);
  --text:#1e293b;--text-sec:#475569;--text-dim:#94a3b8;
  --t1g:#2563eb;--t2g:#0d9488;--t3g:#d97706;--t4g:#db2777;--cng:#dc2626;
}
html.light body{background-image:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(59,130,246,0.05),transparent),
  radial-gradient(ellipse 60% 40% at 80% 100%,rgba(20,184,166,0.04),transparent)}

/* ===== NAVBAR ===== */
.navbar{position:sticky;top:0;z-index:1000;background:rgba(11,17,32,0.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);padding:0 20px;transition:background .35s ease}
html.light .navbar{background:rgba(240,244,248,0.9)}
.nav-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;height:56px;gap:4px}
.nav-brand{font-size:1.1rem;font-weight:700;margin-right:12px;white-space:nowrap;
  background:linear-gradient(135deg,#60a5fa,#2dd4bf);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;cursor:default}
.nav-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{padding:8px 14px;border-radius:var(--radius-xs);cursor:pointer;font-size:0.82rem;font-weight:500;
  color:var(--text-sec);white-space:nowrap;transition:all .2s ease;border:1px solid transparent;user-select:none}
.nav-tab:hover{color:var(--text);background:var(--card)}
.nav-tab.active{color:var(--t1g);background:rgba(59,130,246,0.12);border-color:rgba(59,130,246,0.2)}
.nav-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
.nav-search{width:180px;height:34px;border-radius:17px;border:1px solid var(--border);background:var(--card);
  color:var(--text);padding:0 14px;font-size:0.8rem;outline:none;transition:all .25s ease}
.nav-search:focus{border-color:var(--t1);width:240px;box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
html.light .nav-search{background:rgba(0,0,0,0.04);border-color:rgba(0,0,0,0.1);color:#1e293b}
.theme-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border-light);background:var(--card);
  cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .25s ease}
.theme-btn:hover{transform:scale(1.1)}
.hamburger{display:none;width:34px;height:34px;border-radius:var(--radius-xs);border:1px solid var(--border);
  background:var(--card);cursor:pointer;font-size:1.2rem;align-items:center;justify-content:center}

@media(max-width:900px){
  .nav-tabs{display:none;position:absolute;top:56px;left:0;right:0;background:var(--bg2);
    flex-direction:column;padding:12px;gap:4px;border-bottom:1px solid var(--border);z-index:999}
  .nav-tabs.open{display:flex}
  .nav-tab{padding:12px 16px;border-radius:var(--radius-sm)}
  .hamburger{display:flex}
  .nav-search{width:110px}
  .nav-search:focus{width:150px}
}
@media(max-width:600px){
  .nav-search{width:80px;font-size:0.75rem;padding:0 10px}
  .nav-brand{font-size:0.9rem;margin-right:6px}
}

/* ===== PAGE ===== */
.page{display:none;padding:28px 24px 60px;max-width:1400px;margin:0 auto}
.page.active{display:block}
@media(max-width:600px){.page{padding:16px 12px 40px}}

/* ===== METRICS ===== */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:32px}
@media(max-width:700px){.metrics{grid-template-columns:repeat(2,1fr)}}
.metric-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px 16px;text-align:center;transition:all .25s ease;position:relative;overflow:hidden}
.metric-card:hover{background:var(--card-hover);border-color:var(--border-light);transform:translateY(-2px)}
.metric-card .icon{font-size:1.5rem;margin-bottom:6px;display:block}
.metric-card .value{font-size:1.9rem;font-weight:700;letter-spacing:-0.03em;display:block}
.metric-card .label{font-size:0.78rem;color:var(--text-sec);margin-top:4px;display:block}
.metric-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.metric-card:nth-child(1)::before{background:linear-gradient(90deg,var(--t1),var(--t1g))}
.metric-card:nth-child(2)::before{background:linear-gradient(90deg,var(--t2),var(--t2g))}
.metric-card:nth-child(3)::before{background:linear-gradient(90deg,var(--t3),var(--t3g))}
.metric-card:nth-child(4)::before{background:linear-gradient(90deg,var(--t4),var(--t4g))}
.metric-card:nth-child(1) .value{color:var(--t1g)}
.metric-card:nth-child(2) .value{color:var(--t2g)}
.metric-card:nth-child(3) .value{color:var(--t3g)}
.metric-card:nth-child(4) .value{color:var(--t4g)}

/* ===== SECTION TITLE ===== */
.section-title{font-size:1.15rem;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.section-title .icon{font-size:1.2rem}

/* ===== STAR CARDS ===== */
.star-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-bottom:28px}
.star-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;
  transition:all .25s ease;position:relative;overflow:hidden;cursor:default}
.star-card:hover{background:var(--card-hover);border-color:var(--border-light);transform:translateY(-3px);
  box-shadow:0 8px 30px rgba(0,0,0,0.12)}
.star-card.flagship{border-color:rgba(245,158,11,0.25)}
.star-card.flagship::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--t3),var(--t3g))}
.star-card .stars{font-size:0.85rem;margin-bottom:6px}
.star-card .name{font-size:0.95rem;font-weight:600;margin-bottom:8px;line-height:1.4}
.star-card .meta{display:flex;flex-wrap:wrap;gap:8px;font-size:0.76rem;color:var(--text-sec)}
.star-card .meta span{display:flex;align-items:center;gap:4px}
.star-card .cat-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:0.72rem;
  background:rgba(59,130,246,0.1);color:var(--t1g);border:1px solid rgba(59,130,246,0.18);margin-bottom:8px}
.star-card .focus{font-size:0.75rem;color:var(--text-dim);margin-top:8px;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ===== EXPO LIST ===== */
.expo-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.expo-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;
  transition:all .2s ease;cursor:default}
.expo-item:hover{background:var(--card-hover);border-color:var(--border-light);transform:translateY(-1px)}
.expo-item .name{font-size:0.86rem;font-weight:600;margin-bottom:6px;line-height:1.3}
.expo-item .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:0.74rem;color:var(--text-sec)}
.expo-item .meta span{display:flex;align-items:center;gap:3px}
.expo-item .cat-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:0.68rem;
  background:rgba(59,130,246,0.1);color:var(--t1g);border:1px solid rgba(59,130,246,0.15)}
.decision-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.decision-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:10px;font-size:0.66rem;
  background:rgba(20,184,166,0.09);color:var(--t2g);border:1px solid rgba(20,184,166,0.15);line-height:1.35}
.decision-badge.warn{background:rgba(245,158,11,0.1);color:var(--t3g);border-color:rgba(245,158,11,0.18)}
.source-link{margin-top:8px;font-size:0.72rem}.source-link a{color:var(--t1g);text-decoration:none}.source-link a:hover{text-decoration:underline}.source-missing{color:var(--text-dim)}
.monthly-map-shell{margin:14px 0 22px;border:1px solid var(--border);background:var(--card);padding:14px;border-radius:var(--radius-sm)}.monthly-map-header{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:.82rem;font-weight:600}.monthly-map-header button{border:1px solid var(--border);background:var(--card-hover);color:var(--text);padding:5px 8px;border-radius:var(--radius-xs);cursor:pointer}.map-controls{display:flex;align-items:center;gap:6px}.map-controls button{width:30px;height:28px;padding:0;font-size:1rem;line-height:1}.map-controls #clearMapSelection{width:auto;padding:0 8px;font-size:.75rem}.map-zoom-status{min-width:38px;text-align:center;color:var(--text-sec);font-variant-numeric:tabular-nums}.map-year-tabs{display:flex;gap:4px;margin:0 0 10px}.map-year-tab{border:1px solid var(--border);border-radius:var(--radius-xs);background:var(--card);color:var(--text-sec);padding:6px 10px;font-size:.78rem;cursor:pointer}.map-year-tab.active{background:rgba(59,130,246,.14);border-color:rgba(96,165,250,.6);color:var(--t1g);font-weight:600}.map-workspace{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:14px;align-items:start}.monthly-map{margin-top:12px;min-height:360px;aspect-ratio:2/1;overflow:hidden;background:linear-gradient(180deg,rgba(14,116,144,.22),rgba(59,130,246,.05));border:1px solid var(--border);border-radius:var(--radius-xs)}.monthly-map svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}.monthly-map svg.is-panning{cursor:grabbing}.map-results{border:1px solid var(--border);border-radius:var(--radius-xs);background:var(--card-hover);min-height:360px;max-height:530px;overflow:auto;padding:12px}.map-results .expo-list{display:grid;gap:8px}.map-results .expo-item{margin:0}.map-results .expo-meta{gap:5px}.map-country-shape{fill:rgba(71,85,105,.38);stroke:rgba(148,163,184,.66);stroke-width:.7;transition:fill .16s ease,stroke .16s ease;pointer-events:auto}.map-country-shape.has-events{fill:rgba(59,130,246,.4);stroke:rgba(96,165,250,.95);cursor:pointer}.map-country-shape.has-events:hover,.map-country-shape.has-events:focus{fill:rgba(20,184,166,.62);stroke:var(--t2g);outline:none}.map-marker{fill:var(--t2);stroke:var(--bg);stroke-width:3;cursor:pointer}.map-number{font-size:12px;font-weight:700;fill:var(--text);pointer-events:none}.map-label{font-size:10px;fill:var(--text-sec);pointer-events:none}.map-tooltip{position:fixed;z-index:1200;max-width:220px;padding:6px 8px;border:1px solid var(--border-light);border-radius:var(--radius-xs);background:var(--bg2);color:var(--text);font-size:.75rem;line-height:1.35;box-shadow:0 8px 22px rgba(0,0,0,.25);pointer-events:none}@media(max-width:700px){.map-workspace{grid-template-columns:1fr}.monthly-map{min-height:210px}.map-results{min-height:0;max-height:none}.map-label{font-size:8px}.map-number{font-size:10px}}
@media(max-width:600px){.star-grid,.expo-list{grid-template-columns:1fr}}

/* ===== MONTH TABS ===== */
.month-tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.month-tabs::-webkit-scrollbar{height:5px}
.month-tabs::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.month-tab{flex:0 0 auto;padding:7px 16px;border-radius:20px;font-size:0.8rem;cursor:pointer;
  background:var(--card);border:1px solid var(--border);color:var(--text-sec);transition:all .2s ease;user-select:none}
.month-tab:hover{color:var(--text);border-color:var(--border-light)}
.month-tab.active{background:rgba(59,130,246,0.12);border-color:rgba(59,130,246,0.3);color:var(--t1g)}
.month-count{font-size:0.82rem;color:var(--text-sec);margin-bottom:14px}

/* ===== CAT CHIPS ===== */
.cat-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.cat-chip{padding:6px 14px;border-radius:18px;font-size:0.78rem;cursor:pointer;
  background:var(--card);border:1px solid var(--border);color:var(--text-sec);transition:all .2s ease;user-select:none}
.cat-chip:hover{color:var(--text);border-color:var(--border-light)}
.cat-chip.active{background:rgba(59,130,246,0.12);border-color:rgba(59,130,246,0.3);color:var(--t1g)}
.market-filter{display:flex;gap:6px;margin-bottom:16px}
.market-btn{padding:6px 14px;border-radius:16px;font-size:0.78rem;cursor:pointer;
  background:var(--card);border:1px solid var(--border);color:var(--text-sec);transition:all .2s ease;user-select:none}
.market-btn.active{background:rgba(20,184,166,0.12);border-color:rgba(20,184,166,0.3);color:var(--t2g)}

/* ===== GROUP ===== */
.group-section{margin-bottom:24px}
.group-header{font-size:0.95rem;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;
  padding-bottom:8px;border-bottom:1px solid var(--border)}
.group-count{font-size:0.75rem;color:var(--text-dim);font-weight:400}

/* ===== SEARCH OVERLAY ===== */
.search-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:2000;
  background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.search-overlay.open{display:flex;align-items:flex-start;justify-content:center;padding-top:80px}
.search-panel{width:90%;max-width:640px;max-height:70vh;background:var(--bg2);border:1px solid var(--border-light);
  border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.search-panel-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.search-panel-input{flex:1;height:40px;border-radius:20px;border:1px solid var(--border);background:var(--card);
  color:var(--text);padding:0 16px;font-size:0.9rem;outline:none}
.search-panel-input:focus{border-color:var(--t1)}
html.light .search-panel-input{background:rgba(0,0,0,0.04);color:#1e293b}
.search-close{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--card);
  cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;color:var(--text)}
.search-results{overflow-y:auto;padding:8px 20px}
.search-result-item{padding:10px 0;border-bottom:1px solid var(--border)}
.search-result-item:last-child{border-bottom:none}
.search-result-item .sname{font-size:0.88rem;font-weight:600;margin-bottom:4px}
.search-result-item .smeta{font-size:0.75rem;color:var(--text-sec)}
.search-empty{text-align:center;padding:40px;color:var(--text-dim);font-size:0.9rem}
.buyer-intro{color:var(--text-sec);font-size:.88rem;margin:-12px 0 20px}.buyer-paths{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-bottom:28px}.buyer-path{border:1px solid var(--border);border-top:3px solid var(--t1);padding:18px;background:var(--card);border-radius:var(--radius-sm)}.buyer-path.ev{border-top-color:var(--t2)}.buyer-path.shared{grid-column:1/-1;border-top-color:var(--t3)}.buyer-path-title{display:flex;align-items:center;gap:9px;font-size:1.05rem;font-weight:700;margin-bottom:4px}.buyer-path-desc{color:var(--text-sec);font-size:.8rem;margin-bottom:14px}.buyer-assembly-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.buyer-path.shared .buyer-assembly-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.buyer-assembly-card{display:block;width:100%;text-align:left;border:1px solid var(--border);background:var(--card-hover);color:var(--text);border-radius:var(--radius-xs);padding:11px;cursor:pointer}.buyer-assembly-card:hover{border-color:var(--t1);background:rgba(59,130,246,.09)}.buyer-path.ev .buyer-assembly-card:hover{border-color:var(--t2);background:rgba(20,184,166,.09)}.buyer-path.shared .buyer-assembly-card:hover{border-color:var(--t3);background:rgba(245,158,11,.09)}.buyer-assembly-name{font-size:.83rem;font-weight:650;margin-bottom:2px}.buyer-assembly-desc{color:var(--text-sec);font-size:.72rem;line-height:1.4}.buyer-detail-header{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:16px}.buyer-detail-header h2{font-size:1.05rem;letter-spacing:0}.buyer-back{border:1px solid var(--border);background:var(--card);color:var(--text);width:32px;height:30px;border-radius:var(--radius-xs);cursor:pointer;font-size:1rem}.buyer-detail-meta{color:var(--text-sec);font-size:.8rem;margin-top:5px}.buyer-task-list{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}@media(max-width:700px){.buyer-paths{grid-template-columns:1fr}.buyer-detail-header{align-items:center}.buyer-asse // ===== HELPERS =====
function starStr(n){return n>=3?'⭐⭐⭐':n===2?'⭐⭐':n===1?'⭐':''}
function getMonth(e){return e.month||(new Date(e.sortDate).getMonth()+1)||1}
function getYear(e){return e.year||(e.sortDate>=10000000?Math.floor(e.sortDate/10000):2026)}
function isCurrentYear(e){return getYear(e)===2026}
function yearLabel(e){return getYear(e)>=2027?'2027预告':'2026展期'}
function getCountry(loc){
  // Extract country from location string like "美国 拉斯维加斯" or "日本东京".
  const cnMap={'上海':'中国','北京':'中国','广州':'中国','深圳':'中国','重庆':'中国','成都':'中国','武汉':'中国',
    '杭州':'中国','南京':'中国','天津':'中国','苏州':'中国','青岛':'中国','济南':'中国','郑州':'中国',
    '昆明':'中国','合肥':'中国','佛山':'中国','东莞':'中国','无锡':'中国','宁波':'中国','贵阳':'中国',
    '海口':'中国','温州':'中国','昆山':'中国','邯郸':'中国','太原':'中国','梁山':'中国','义乌':'中国',
    '南通':'中国','西安':'中国','厦门':'中国','长春':'中国','长沙':'中国','大连':'中国','石家庄':'中国',
    '沈阳':'中国','南昌':'中国','福州':'中国','柳州':'中国','荆州':'中国','盐城':'中国','玉环':'中国',
    '瑞安':'中国','广饶':'中国','喀什':'中国','兰州':'中国','哈尔滨':'中国','台北':'中国台湾',
    '香港':'中国香港','中国台湾':'中国台湾','中国香港':'中国香港'};
  if(!loc)return '';
  const countryHints=['中国台湾','中国香港','中国','美国','加拿大','墨西哥','德国','法国','意大利','西班牙','英国','荷兰','瑞士','奥地利','波兰','捷克','土耳其','俄罗斯','葡萄牙','比利时','瑞典','匈牙利','日本','韩国','泰国','印度尼西亚','印尼','越南','马来西亚','菲律宾','新加坡','柬埔寨','印度','巴西','阿根廷','秘鲁','埃及','阿联酋','沙特','伊拉克','澳大利亚','塞尔维亚'];
  const direct=countryHints.find(c=>loc.includes(c));
  if(direct)return direct;
  const englishHints=[
    ['USA','美国'],['United States','美国'],['Detroit','美国'],['Las Vegas','美国'],['Los Angeles','美国'],['New York','美国'],['Chicago','美国'],['Louisville','美国'],
    ['Germany','德国'],['Frankfurt','德国'],['Stuttgart','德国'],['Hannover','德国'],['Munich','德国'],['Cologne','德国'],
    ['Japan','日本'],['Tokyo','日本'],['Nagoya','日本'],['Yokohama','日本'],['Aichi','日本'],['Makuhari','日本'],
    ['UK','英国'],['Birmingham','英国'],['London','英国'],['France','法国'],['Paris','法国'],['Italy','意大利'],['Milan','意大利'],
    ['Spain','西班牙'],['Barcelona','西班牙'],['Thailand','泰国'],['Bangkok','泰国'],['India','印度'],['Poland','波兰'],
    ['Warsaw','波兰'],['Brazil','巴西'],['Sao Paulo','巴西'],['Netherlands','荷兰'],['Sweden','瑞典'],['Australia','澳大利亚']
  ];
  const hit=englishHints.find(([k])=>loc.toLowerCase().includes(k.toLowerCase()));
  if(hit)return hit[1];
  const first=loc.split(/[\s,，]/)[0];
  return cnMap[first]||first;
}
function isChinaLocation(loc){
  return getCountry(loc).startsWith('中国')||/北京|上海|广州|深圳|重庆|成都|武汉|天津|苏州|南京|宁波|温州|瑞安|邯郸|永年|济南|青岛|石家庄|长沙|大连|哈尔滨|兰州|西安|沈阳|南昌|福州|佛山|昆山|玉环|广饶|海口|喀什|台北|香港/.test(loc||'');
}
function regionLabel(e){
  if(e.region)return e.region;
  const c=getCountry(e.location);
  if(c.startsWith('中国'))return '中国';
  if(['美国','加拿大','墨西哥'].includes(c))return '北美';
  if(['德国','法国','意大利','西班牙','英国','荷兰','瑞士','奥地利','波兰','捷克','土耳其','俄罗斯','葡萄牙','比利时','瑞典','匈牙利'].includes(c))return '欧洲';
  if(['日本','韩国'].includes(c))return '日韩';
  if(['泰国','印度尼西亚','印尼','越南','马来西亚','菲律宾','新加坡','柬埔寨'].includes(c))return '东南亚';
  if(['阿联酋','沙特','伊拉克','埃及'].includes(c))return '中东/非洲';
  if(['巴西','阿根廷','秘鲁'].includes(c))return '拉美';
  if(c==='印度')return '印度';
  return '其他海外';
}
function supplyChainLabel(e){
  if(e.sc)return e.sc;
  const map={
    '材料/金属加工':'原材料/材料工艺','模具/冲压':'制造装备/工艺设备','表面处理/涂装':'制造装备/表面工程',

    '汽车电子':'电子电气/系统集成','汽车半导体/芯片':'电子电气/车规芯片','新能源/EV':'三电/新能源','智能驾驶':'智能化/ADAS',
    '车联网/座舱':'智能化/座舱网联','汽车软件/OTA':'软件/SDV','汽车测试/验证':'工程研发/测试验证','汽车安全':'工程研发/安全法规',

    '汽车维修设备':'售后流通/维修设备','润滑油/养护品':'售后流通/养护品','商用车':'整车/商用车','整车车展':'整车/OEM市场'
  };
  return map[e.cat]||'汽车产业链';
}
function verticalLabel(e){

function normalizeRecord(e){
  const profile=typeof getSupplyChainProfile==='function'?getSupplyChainProfile(e):{sc:supplyChainLabel(e),vertical:verticalLabel(e),buyerValue:['找供应商'],sellerValue:['开发产业客户'],buyerTasks:['供应商开发'],sellerTargets:['OEM'],marketUse:{}};
  if(isChinaLocation(e.location))e.market='中国';
  if(!e.region)e.region=regionLabel(e);
  if(!e.sc)e.sc=profile.sc;
  if(!e.vertical)e.vertical=profile.vertical;
  if(!e.buyerValue)e.buyerValue=profile.buyerValue;
  if(!e.sellerValue)e.sellerValue=profile.sellerValue;
  if(!e.buyerTasks)e.buyerTasks=profile.buyerTasks;
  if(!e.sellerTargets)e.sellerTargets=profile.sellerTargets;
  if(!e.marketUse)e.marketUse=(profile.marketUse||{})[e.region]||(profile.marketUse||{}).default||'';
  return e;
}
function normalizeExhibitions(){exhibitions.forEach(normalizeRecord)}

function canonicalExpoName(name){return(name||'').toLowerCase().replace(/20\d{2}/g,'').replace(/[（(][^）)]*[）)]/g,'').replace(/[【】\[\]·\s-]/g,'').replace(/第\d+届/g,'')}
function exhibitionIdentity(e){return canonicalExpoName(e.name)+'|'+getYear(e)+'|'+e.sortDate}
function exhibitionScore(e){return ['address','source','audience','buyerValue','sellerValue','sellerTargets','marketUse','vertical'].reduce((score,key)=>score+(e[key]&&(!Array.isArray(e[key])||e[key].length)?1:0),0)}
function uniqueExhibitions(data){const groups=new Map();data.forEach(e=>{const key=exhibitionIdentity(e);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(e)});return[...groups.values()].map(group=>{const best=[...group].sort((a,b)=>exhibitionScore(b)-exhibitionScore(a))[0];if(group.length===1)return best;return{...best,relatedCategories:[...new Set(group.map(e=>e.cat))],relatedSupplyChains:[...new Set(group.map(e=>e.sc))]}})}
const displayExhibitions=uniqueExhibitions(exhibitions);
const currentExhibitions=()=>displayExhibitions.filter(isCurrentYear);
const previewExhibitions=()=>displayExhibitions.filter(e=>getYear(e)>=2027||e.status==='2027预告');
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function now(){const d=new Date();return{y:d.getFullYear(),m:d.getMonth()+1}}

function doSearch(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  if(!q){document.getElementById('searchResults').innerHTML='<div class="search-empty">输入关键词搜索 '+displayExhibitions.length+' 场展会</div>';return}
  const results=displayExhibitions.filter(e=>{
    const decisionText=[...(e.buyerValue||[]),...(e.sellerValue||[]),...(e.buyerTasks||[]),...(e.sellerTargets||[]),e.marketUse||''].join(' ').toLowerCase();
    return e.name.toLowerCase().includes(q)||(e.location||'').toLowerCase().includes(q)||
      e.cat.toLowerCase().includes(q)||(e.focus||'').toLowerCase().includes(q)||(e.market||'').toLowerCase().includes(q)||
      (e.sc||'').toLowerCase().includes(q)||(e.audience||'').toLowerCase().includes(q)||(e.region||'').toLowerCase().includes(q)||
      (e.status||'').toLowerCase().includes(q)||(e.vertical||'').toLowerCase().includes(q)||decisionText.includes(q)||(e.relatedCategories||[]).join(' ').toLowerCase().includes(q);
  }).slice(0,40);
  if(!results.length){document.getElementById('searchResults').innerHTML='<div class="search-empty">未找到匹配的展会</div>';return}
  document.getElementById('searchResults').innerHTML=results.map(e=>
    '<div class="search-result-item"><div class="sname">'+starStr(e.star)+' '+escapeHtml(e.name)+'</div><div class="smeta">'+
    escapeHtml(e.cat)+' · '+escapeHtml(e.date)+' · '+escapeHtml(e.location)+(e.address?' · '+escapeHtml(e.address):'')+'</div></div>'
  ).join('');
}

const MAP_COUNTRY_LABELS=Object.fromEntries(Object.entries(MAP_COUNTRY_NAMES).map(([label,name])=>[name,label]));

function projectGeo(latitude,longitude){return{x:((longitude+180)/360)*1000,y:((90-latitude)/180)*500}}
function getMonthlyMapGroups(month){const groups=new Map();displayExhibitions.filter(e=>getYear(e)===curMapYear&&getMonth(e)===month).forEach(e=>{const geo=typeof getExhibitionGeo==='function'?getExhibitionGeo(e):null;if(!geo)return;const key=geo.country+':'+(geo.city||'国家中心');if(!groups.has(key))groups.set(key,{key,...geo,events:[]});groups.get(key).events.push(e)});return[...groups.values()]}

function bindCountryInteractions(el,countries){el.querySelectorAll('[data-map-country]').forEach(path=>{const country=path.dataset.mapCountry,events=countries.get(country)||[],label=MAP_COUNTRY_LABELS[country]||country;const show=event=>{const tooltip=getMapTooltip();tooltip.textContent=label+(events.length?' · '+events.length+' 场当月展会':' · 本月暂无展会');tooltip.style.left=Math.min(event.clientX+12,window.innerWidth-230)+'px';tooltip.style.top=Math.min(event.clientY+12,window.innerHeight-48)+'px';tooltip.hidden=false};path.addEventListener('mouseenter',show);path.addEventListener('mousemove',show);path.addEventListener('mouseleave',()=>getMapTooltip().hidden=true);if(events.length){const select=()=>selectMapGroup((MAP_COUNTRY_LABELS[country]||country)+':__country__');path.addEventListener('click',select);path.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();select()}})}})}
function bindMapPan(el){const svg=el.querySelector('svg');if(!svg)return;let drag=null;svg.addEventListener('pointerdown',event=>{if(event.button!==0||mapZoom===1)return;const rect=svg.getBoundingClientRect();drag={pointerId:event.pointerId,x:event.clientX,y:event.clientY,centerX:mapCenterX,centerY:mapCenterY,width:1000/mapZoom,height:500/mapZoom,rect};svg.dataset.panned='';svg.setPointerCapture?.(event.pointerId);svg.classList.add('is-panning')});svg.addEventListener('pointermove',event=>{if(!drag||event.pointerId!==drag.pointerId)return;const dx=(event.clientX-drag.x)*drag.width/drag.rect.width,dy=(event.clientY-drag.y)*drag.height/drag.rect.height;if(Math.abs(dx)+Math.abs(dy)>3)svg.dataset.panned='1';mapCenterX=drag.centerX-dx;mapCenterY=drag.centerY-dy;const view=getMapView();svg.setAttribute('viewBox',view.x+' '+view.y+' '+view.width+' '+view.height)});const stop=event=>{if(!drag||event.pointerId!==drag.pointerId)return;svg.releasePointerCapture?.(event.pointerId);svg.classList.remove('is-panning');drag=null};svg.addEventListener('pointerup',stop);svg.addEventListener('pointercancel',stop);svg.addEventListener('click',event=>{if(svg.dataset.panned==='1'){event.preventDefault();event.stopImmediatePropagation();svg.dataset.panned=''}},true)}
function renderMonthlyMap(){const el=document.getElementById('monthlyMap');if(!el)return;if(!worldGeoFeatures){el.innerHTML='<div style="padding:32px;text-align:center;color:var(--text-dim)">正在加载可交互国家边界…</div>';return}const groups=getMonthlyMapGroups(curMonth),countries=new Map();groups.forEach(g=>{if(!countries.has(g.country))countries.set(g.country,[]);countries.get(g.country).push(g)});const activeMapNames=new Set([...countries.keys()].map(country=>MAP_COUNTRY_NAMES[country]).filter(Boolean)),view=getMapView();document.getElementById('mapPeriodLabel').textContent=curMapYear+'年 '+curMonth+'月全球展会分布';document.getElementById('mapZoomStatus').textContent=Math.round(mapZoom*100)+'%';let svg='<svg viewBox="'+view.x+' '+view.y+' '+view.width+' '+view.height+'" role="img" aria-label="当月全球展会分布地图"><g class="map-countries">';worldGeoFeatures.forEach(feature=>{const name=feature.properties.name,path=geometryToPath(feature.geometry),hasEvents=activeMapNames.has(name);svg+='<path class="map-country-shape'+(hasEvents?' has-events':'')+'" data-map-country="'+escapeHtml(name)+'" d="'+path+'"'+(hasEvents?' role="button" tabindex="0"':'')+'></path>'});svg+='</g>';groups.forEach(g=>{const p=projectGeo(g.latitude,g.longitude),count=g.events.length;svg+='<g onclick="selectMapGroup(\''+g.key+'\')" role="button" tabindex="0"><circle class="map-marker" cx="'+p.x+'" cy="'+p.y+'" r="'+(8+Math.min(count,5))+'"><title>'+escapeHtml(g.country+' '+(g.city||'国家中心')+' '+count+'场')+'</title></circle><text class="map-number" x="'+p.x+'" y="'+(p.y+4)+'" text-anchor="middle">'+count+'</text><text class="map-label" x="'+p.x+'" y="'+(p.y+24)+'" text-anchor="middle">'+escapeHtml(g.city||g.country)+'</text></g>'});el.innerHTML=svg+'</svg>';bindCountryInteractions(el,countries);bindMapPan(el)}
function renderMapResults(){const all=displayExhibitions.filter(e=>getYear(e)===curMapYear&&getMonth(e)===curMonth).sort((a,b)=>a.sortDate-b.sortDate);let events=all,label='全部展会';if(selectedMapGroupKey){const groups=getMonthlyMapGroups(curMonth),selected=selectedMapGroupKey.endsWith(':__country__')?groups.filter(g=>g.country===selectedMapGroupKey.slice(0,-12)):groups.filter(g=>g.key===selectedMapGroupKey);events=selected.flatMap(g=>g.events).sort((a,b)=>a.sortDate-b.sortDate);label=selectedMapGroupKey.endsWith(':__country__')?selectedMapGroupKey.slice(0,-12):selected[0].country+' '+(selected[0].city||'')}document.getElementById('mapResultsSummary').textContent=curMapYear+'年 '+curMonth+'月 · '+label+' · '+events.length+' 场展会';document.getElementById('mapResultsContent').innerHTML=events.length?events.map(expoItem).join(''):'<div style="color:var(--text-dim);padding:32px;text-align:center">该地区本月暂无展会</div>'}
function selectMapGroup(key){selectedMapGroupKey=key;document.getElementById('clearMapSelection').hidden=false;renderMapResults()}
function clearMapSelection(){selectedMapGroupKey='';document.getElementById('clearMapSelection').hidden=true;renderMapResults()}
function selectMapYear(year){curMapYear=year;clearMapSelection();document.querySelectorAll('.map-year-tab').forEach(tab=>tab.classList.toggle('active',Number(tab.dataset.year)===year));renderMonthlyMap()}
function zoomMap(amount){mapZoom=Math.max(1,Math.min(3,mapZoom+amount));renderMonthlyMap()}
function resetMapZoom(){mapZoom=1;mapCenterX=500;mapCenterY=250;renderMonthlyMap()}
function renderMonthTabs(){
  const names=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
  const tabs=names.map((n,i)=>
    '<div class="month-tab'+(i+1===curMonth?' active':'')+'" data-m="'+(i+1)+'" onclick="selectMonth('+(i+1)+')">'+n+'</div>'
  ).join('');

function selectMonth(m){

function renderMonthContent(){

// ===== PAGE 3: CATEGORY =====
let curCat='全部',curSc='全部',curCatMarket='全部',decisionMode='all';
const DECISION_MODES={all:'时间顺序',procurement:'采购优先',export:'外贸优先',technology:'技术优先',channel:'渠道优先'};
function decisionScore(e,mode){
  const text=[e.name,e.cat,e.focus,e.sc,e.vertical,e.audience,(e.relatedCategories||[]).join(' ')].join(' ').toLowerCase();
  const keywords={procurement:['采购','供应商','oem','tier1','制造','材料','电池','芯片','连接器','线束'],export:['海外','出口','进口商','经销商','渠道','外贸','国际'],technology:['技术','测试','验证','智能','芯片','软件','电驱','电池','nvh','adas'],channel:['售后','汽配','维修','轮胎','改装','经销商','渠道','车队']};
  return (e.star||0)*3+(e.source?2:0)+(e.addressStatus==='待核验'?-1:1)+(keywords[mode]||[]).reduce((score,key)=>score+(text.includes(key)?2:0),0);
}
function decisionLabel(e){const scores=Object.keys(DECISION_MODES).filter(k=>k!=='all').map(k=>[k,decisionScore(e,k)]).sort((a,b)=>b[1]-a[1]);return DECISION_MODES[scores[0][0]]}
function exhibitionSeries(e){const name=(e.name||'').toLowerCase();if(name.includes('automechanika'))return 'Automechanika 系列';if(name.includes('motortec'))return 'Motortec 系列';if(name.includes('battery show'))return 'Battery Show 系列';if(name.includes('semicon')||name.includes('semiconductor'))return 'SEMICON 系列';if(name.includes('tapa'))return 'TAPA 系列';if(name.includes('izb'))return 'IZB 系列';if(name.includes('electronica'))return 'electronica 系列';return '独立展会'}
function workingLanguage(e){const region=(e.region||e.location||'').toLowerCase();if(/中国|日本|韩国|泰国|印度|东南亚|亚洲/.test(region))return '当地语言 + 英语（以官网为准）';return '英语或当地语言 + 英语（以官网为准）'}
function participationHint(e){return e.source?'官网通常提供报名、展商申请或观众登记入口；邀请函以主办方实际审核为准。':'先核验主办方官网，再确认线上参会与邀请函安排。'}
function renderDecisionToolbar(){const el=document.getElementById('decisionToolbar');if(!el)return;el.innerHTML='<span class="decision-toolbar-label">决策排序</span>'+Object.entries(DECISION_MODES).map(([key,label])=>'<button type="button" class="decision-mode '+(decisionMode===key?'active':'')+'" onclick="setDecisionMode(\''+key+'\')">'+label+'</button>').join('')+'<span class="toolbar-spacer"></span><button type="button" class="decision-action" onclick="exportFavorites()">↧ 导出收藏 CSV</button><button type="button" class="decision-action" onclick="exportFavoritesICS()">↧ 导出 ICS</button><button type="button" class="decision-action" onclick="showFavoriteCount()">☆ 收藏清单</button>'}
function setDecisionMode(mode){decisionMode=mode;renderDecisionToolbar();renderCatContent()}
function favoriteKey(e){return e.name+'|'+e.date+'|'+e.location}
function getFavorites(){try{return JSON.parse(localStorage.getItem('autoExpoFavorites')||'[]')}catch{return[]}}
function isFavorite(e){return getFavorites().includes(favoriteKey(e))}
function toggleFavorite(e){const key=favoriteKey(e),items=getFavorites(),next=items.includes(key)?items.filter(item=>item!==key):[...items,key];localStorage.setItem('autoExpoFavorites',JSON.stringify(next));openExhibitionDetail(e.name)}
function showFavoriteCount(){const count=getFavorites().length;alert(count?'已收藏 '+count+' 场展会，可在展会详情中取消收藏。':'还没有收藏展会。')}
function exportFavorites(){const keys=new Set(getFavorites()),items=displayExhibitions.filter(e=>keys.has(favoriteKey(e)));if(!items.length){showFavoriteCount();return}const rows=[['展会名称','日期','地点','地址','分类','供应链环节','官网']].concat(items.map(e=>[e.name,e.date,e.location,e.address,e.cat,e.sc,e.source]));const csv='\\ufeff'+rows.map(row=>row.map(value=>'"'+String(value||'').replace(/"/g,'""')+'"').join(',')).join('\\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='auto-expo-favorites.csv';link.click();URL.revokeObjectURL(url)}
function exportFavoritesICS(){const keys=new Set(getFavorites()),items=displayExhibitions.filter(e=>keys.has(favoriteKey(e)));if(!items.length){showFavoriteCount();return}const events=items.map((e,index)=>{const date=(e.sortDate||'').replace(/-/g,'');if(!/^\\d{8}$/.test(date))return '';return 'BEGIN:VEVENT\\r\\nUID:auto-expo-'+index+'-'+date+'@auto-expo\\r\\nDTSTART;VALUE=DATE:'+date+'\\r\\nSUMMARY:'+String(e.name||'').replace(/[\\r\\n,;]/g,' ')+'\\r\\nLOCATION:'+String([e.location,e.address].filter(Boolean).join(' ')).replace(/[\\r\\n,;]/g,' ')+'\\r\\nDESCRIPTION:'+String(e.source||'').replace(/[\\r\\n,;]/g,' ')+'\\r\\nEND:VEVENT';}).filter(Boolean).join('\\r\\n');if(!events){alert('收藏展会暂无可识别的日期，暂不能导出 ICS。');return}const ics='BEGIN:VCALENDAR\\r\\nVERSION:2.0\\r\\nPRODID:-//Auto Expo//Exhibition Calendar//CN\\r\\n'+events+'\\r\\nEND:VCALENDAR\\r\\n';const url=URL.createObjectURL(new Blob([ics],{type:'text/calendar;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='auto-expo-favorites.ics';link.click();URL.revokeObjectURL(url)}
function renderSupplyChainChips(){
  const all=[...new Set(currentExhibitions().map(e=>e.sc))].sort((a,b)=>a.localeCompare(b,'zh'));
  document.getElementById('scChips').innerHTML=['全部',...all].map(c=>'<div class="cat-chip'+(c===curSc?' active':'')+'" onclick="selectSupplyChain(this)">'+escapeHtml(c)+'</div>').join('');
}
function selectSupplyChain(el){
  curSc=el.textContent.trim();
  document.querySelectorAll('#scChips .cat-chip').forEach(t=>t.classList.remove('active')); el.classList.add('active'); renderCatContent();
}
function renderCatChips(){
  const allCats=[...new Set(currentExhibitions().map(e=>e.cat))].sort((a,b)=>a.localeCompare(b,'zh'));
  const cats=['全部',...allCats];
  document.getElementById('catChips').innerHTML=cats.map(c=>
    '<div class="cat-chip'+(c===curCat?' active':'')+'" data-cat="'+escapeHtml(c)+'" onclick="selectCat(this)">'+
    ((catIcons[c]||'📌')+' '+escapeHtml(c))+'</div>'
  ).join('');
  renderCatContent();

function selectCat(el){
  curCat=el.getAttribute('data-cat');
  document.querySelectorAll('.cat-chip').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderCatContent();
}
function filterCatMarket(m){
  curCatMarket=m;
  document.querySelectorAll('.market-btn').forEach(t=>t.classList.remove('active'));
  document.querySelector('.market-btn[data-market="'+m+'"]').classList.add('active');
  renderCatContent();
}
function renderCatContent(){
  const data=currentExhibitions();
  let items=curCat==='全部'?[...data]:data.filter(e=>e.cat===curCat||(e.relatedCategories||[]).includes(curCat));
  if(curSc!=='全部')items=items.filter(e=>e.sc===curSc||(e.relatedSupplyChains||[]).includes(curSc));
  if(curCatMarket==='中国')items=items.filter(e=>e.market==='中国');
  else if(curCatMarket==='海外')items=items.filter(e=>e.market!=='中国');
  items.sort((a,b)=>decisionMode==='all'?a.sortDate-b.sortDate:decisionScore(b,decisionMode)-decisionScore(a,decisionMode)||a.sortDate-b.sortDate);
  document.getElementById('catContent').innerHTML=items.length?items.map(expoItem).join(''):
    '<div style="color:var(--text-dim);padding:40px;text-align:center">暂无展会</div>';
}

// ===== PAGE 4: DOMESTIC =====
function renderDomestic(){
  const items=currentExhibitions().filter(e=>e.market==='中国').sort((a,b)=>a.sortDate-b.sortDate);
  document.getElementById('domesticCount').textContent='共 '+items.length+' 场国内展会';
  const grouped={};
  items.forEach(e=>{const m=getMonth(e);if(!grouped[m])grouped[m]=[];grouped[m].push(e)});
  const mNames=["","1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
  let html='';
  for(let m=1;m<=12;m++){
    if(!grouped[m]||!grouped[m].length)continue;
    html+='<div class="group-section"><div class="group-header">'+mNames[m]+' <span class="group-count">'+grouped[m].length+'场</span></div><div class="expo-list">'+grouped[m].map(expoItem).join('')+'</div></div>';
  }
  document.getElementById('domesticContent').innerHTML=html;
}

// ===== PAGE 5: OVERSEAS =====
function renderOverseas(){
  const items=currentExhibitions().filter(e=>e.market!=='中国').sort((a,b)=>a.sortDate-b.sortDate);
  document.getElementById('overseasCount').textContent='共 '+items.length+' 场海外展会';
  const regions={'🇪🇺 欧洲':[],'🇺🇸 北美':[],'🇯🇵🇰🇷 日韩':[],'🌏 东南亚':[],'🇮🇳 印度':[],'🌎 拉美':[],'🕌 中东/非洲':[],'🌐 其他海外':[]};
  const regionKeys={'欧洲':'🇪🇺 欧洲','北美':'🇺🇸 北美','日韩':'🇯🇵🇰🇷 日韩','东南亚':'🌏 东南亚','印度':'🇮🇳 印度','拉美':'🌎 拉美','中东/非洲':'🕌 中东/非洲','其他海外':'🌐 其他海外'};
  items.forEach(e=>{
    const key=regionKeys[regionLabel(e)]||'🌐 其他海外';
    regions[key].push(e);
  });
  let html='';
  for(const [r,list] of Object.entries(regions)){
    if(!list.length)continue;
    html+='<div class="group-section"><div class="group-header">'+r+' <span class="group-count">'+list.length+'场</span></div><div class="expo-list">'+list.map(expoItem).join('')+'</div></div>';
  }
  document.getElementById('overseasContent').innerHTML=html;
}

// ===== PAGE 6: STARRED =====
function renderStarred(){
  const data=currentExhibitions();
  const s3=data.filter(e=>e.star>=3).sort((a,b)=>a.sortDate-b.sortDate);
  const s2=data.filter(e=>e.star===2).sort((a,b)=>a.sortDate-b.sortDate);
  const s1=data.filter(e=>e.star===1).sort((a,b)=>a.sortDate-b.sortDate);
  let html='';
  if(s3.length)html+='<div class="group-section"><div class="group-header">⭐⭐⭐ 旗舰展会 <span class="group-count">'+s3.length+'场</span></div><div class="star-grid">'+s3.map(starCard).join('')+'</div></div>';
  if(s2.length)html+='<div class="group-section"><div class="group-header">⭐⭐ 重点展会 <span class="group-count">'+s2.length+'场</span></div><div class="expo-list">'+s2.map(expoItem).join('')+'</div></div>';
  if(s1.length)html+='<div class="group-section"><div class="group-header">⭐ 推荐展会 <span class="group-count">'+s1.length+'场</span></div><div class="expo-list">'+s1.map(expoItem).join('')+'</div></div>';
  document.getElementById('starredContent').innerHTML=html;
}

function renderPreview2027(){
  const items=previewExhibitions().sort((a,b)=>a.sortDate-b.sortDate);
  document.getElementById('preview2027Count').textContent='共 '+items.length+' 场，已公布日期优先；日期未确认的系列展会不虚构日期';

}
